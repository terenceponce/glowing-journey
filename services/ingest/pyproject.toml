[project]
name = "ingest"
version = "0.1.0"
description = "Chunk a markdown corpus, embed it via the embedder service and upsert into Qdrant"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "qdrant-client==1.19.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["chunking", "ingest", "query"]
