[project]
name = "embedder"
version = "0.1.0"
description = "FastAPI embedding service backed by fastembed"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "fastembed==0.9.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
